services:
  # 1. BASE DE DATOS
  db:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_datos:/data/db

  # 2. WEB
  webapp:
    build: ./webapp
    image: li3r/escapadas-webapp:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://db:27017/
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  # 3. WORKER
  worker:
    build: ./worker
    image: li3r/escapadas-worker:latest
    environment:
      - MONGO_URI=mongodb://db:27017/
    depends_on:
      - db

volumes:
  mongo_datos:
