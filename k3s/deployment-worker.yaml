apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
        - name: worker-contenedor
          image: li3r/escapadas-worker:latest
          env:
            - name: MONGO_URI
              value: "mongodb://db:27017/"
