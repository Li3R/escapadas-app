apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      containers:
        - name: webapp-contenedor
          image: li3r/escapadas-webapp:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: "mongodb://db:27017"
